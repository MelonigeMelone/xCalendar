<body>
  <div class="login-form">
    <div class="login-headline-image-container">
      <img src="assets/img/xcalendar-logo.png" />
    </div>

    <div class="login-form-separator">
      <hr />
    </div>

    <div class="login-form-headline">
      <h2>User log in</h2>
    </div>

    <div class="login-form-user-input-textfield-container">
      <form
        appearance="outline"
        class="login-form-user-field"
        id="login-form-mail-address-field"
      >
        <label>Email address</label>
        <input
          #userMailAddress
          type="email"
          placeholder="Ex. name@example.com"
        />
      </form>

      <a
        href="placeholder"
        class="login-form-forgot-password-link"
        tabindex="-1"
        >Forgot password</a
      >

      <form
        appearance="outline"
        class="login-form-user-field"
        id="login-form-password-field"
      >
        <label>Password</label>
        <input
          #userPassword
          (keydown.enter)="
            onLogInWith(userMailAddress.value, userPassword.value)
          "
          matInput
          [type]="hide ? 'password' : 'text'"
        />
        <button
          tabindex="-1"
          mat-icon-button
          matSuffix
          (click)="hide = !hide"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide"
        ></button>
      </form>
    </div>

    <div class="login-form-login-button-container">
      <button
        mat-raised-button
        type="submit"
        class="login-form-login-button"
        color="primary"
        (click)="onLogInWith(userMailAddress.value, userPassword.value)"
      >
        Log in
      </button>
    </div>

    <div class="login-form-register-hint-container">
      <p class="login-form-register-hint">
        Don't have a xCalendar account?
        <a routerLink="/registration" tabindex="-1">Register now</a>
      </p>
    </div>
  </div>
</body>
