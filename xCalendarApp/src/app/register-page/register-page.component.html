<body>
  <div class="register-form">
    <div class="register-headline-image-container">
      <img src="assets/img/xcalendar-logo.png" />
    </div>

    <div class="register-form-separator">
      <hr />
    </div>

    <div class="register-form-headline">
      <h2>Registration</h2>
    </div>

    <div class="register-form-user-input-textfield-container">
      <form class="register-form-user-field" id="user-username-field">
        <label>Username</label>
        <input
          type="username"
          matInput
          [formControl]="usernameFormControl"
          placeholder="Username to show"
        />
      </form>

      <form
        appearance="outline"
        class="register-form-user-field"
        id="user-mail-address-field"
      >
        <label>Email address</label>
        <input
          type="email"
          matInput
          [formControl]="emailFormControl"
          placeholder="Ex. name@example.com"
        />
      </form>

      <form
        appearance="outline"
        class="register-form-user-field"
        id="user-password-field"
      >
        <label>Password</label>
        <input matInput />
      </form>

      <form
        appearance="outline"
        class="register-form-user-field"
        id="user-confirm-password-field"
      >
        <label>Confirm Password</label>
        <input matInput [type]="hide ? 'password' : 'text'" />
        <button
          tabindex="-1"
          mat-icon-button
          matSuffix
          (click)="hide = !hide"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide"
        >
          <div>{{ hide ? "visibility_off" : "visibility" }}</div>
        </button>
      </form>
    </div>

    <div class="register-form-register-button-container">
      <button
        mat-raised-button
        class="register-form-register-button"
        color="primary"
      >
        Register now
      </button>
    </div>

    <div class="register-form-login-hint-container">
      <p class="register-form-login-hint">
        Already have a xCalendar account?
        <a routerLink="/login" tabindex="-1">Log in</a>
      </p>
    </div>
  </div>
</body>
