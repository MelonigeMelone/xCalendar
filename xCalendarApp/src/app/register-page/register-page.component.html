<div class="background">
  <div class="register-form">
    <div class="xcal-logo-container">
      <img src="assets/img/xcalendar-logo.png" alt="xcal-logo" />
    </div>
    <div class="horizontal-line"></div>
    <div class="registration-headline">
      <h2>Registration</h2>
    </div>
    <div class="user-information-container">
      <div class="user-input-container">
        <label for="username-input">Username*</label>
        <input
          #username
          [ngClass]="{ 'input-error-state': usernameHasError }"
          type="text"
          id="username-input"
          (click)="resetErrorStateOfUsername()"
        />
      </div>
      <div class="user-input-container">
        <label for="email-input">E-Mail</label>
        <input
          #email
          type="email"
          id="email-input"
          [ngClass]="{ 'input-error-state': emailHasError }"
          (click)="resetErrorStateOfEmail()"
        />
      </div>
      <div class="user-input-container">
        <label for="phone-input">Phone</label>
        <input
          #phone
          type="tel"
          id="phone-input"
          [ngClass]="{ 'input-error-state': phoneHasError }"
          (click)="resetErrorStateOfPhone()"
        />
      </div>
      <div class="user-input-container">
        <label for="password-input">Password*</label>
        <input
          #password
          type="password"
          id="password-input"
          (click)="resetErrorStateOfPassword()"
          [ngClass]="{ 'input-error-state': passwordHasError }"
        />
      </div>
      <div class="user-input-container">
        <label for="confirm-password-input">Confirm password*</label>
        <input
          #confirmedPassword
          type="password"
          [ngClass]="{ 'input-error-state': passwordHasError }"
          id="confirm-password-input"
          (click)="resetErrorStateOfPassword()"
        />
      </div>
    </div>
    <div class="error-message-container">
      <p class="error-message">{{ errorMsg }}</p>
    </div>

    <div class="submit-registration-button-container">
      <button
        class="submit-registration"
        (click)="
          onFormSubmit(
            username.value,
            email.value,
            phone.value,
            password.value,
            confirmedPassword.value
          )
        "
      >
        Register now
      </button>
    </div>
    <div class="login-container">
      <p>
        Already have an xCalendar account? <a routerLink="/login">Log in</a>
      </p>
    </div>
  </div>
</div>
