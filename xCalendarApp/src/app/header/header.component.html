<header>
  <div class="app-header">
    <mat-toolbar class="app-header">
      <button (click)="onClickHome()"><img class="xcalendar-logo" src="assets/img/xcalendar-logo-accent.png" alt=""></button>
      <a (click)="onClickProfile()" class="user-profile-link">
        <div class="user-profile-picture">
          <img src="assets/img/profile-pic.png" alt="">
        </div>
        <div class="username">
          <h3>{{ userMailAddress }}</h3>
        </div>
      </a>
    </mat-toolbar>
  </div>
  <hr class="fade-out-header">
</header>
